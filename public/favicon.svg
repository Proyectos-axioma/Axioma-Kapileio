<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo café espresso oscuro (combinando con tu tema oscuro) -->
    <linearGradient id="bgKapileio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291E21" />
      <stop offset="100%" stop-color="#171012" />
    </linearGradient>

    <!-- Degradado cálido ámbar / terracota (combinando con tus botones y acentos) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89D54" />
      <stop offset="100%" stop-color="#B85A24" />
    </linearGradient>

    <!-- Degradado crema suave para detalles -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E2" />
      <stop offset="100%" stop-color="#EED4B7" />
    </linearGradient>
  </defs>

  <!-- Contenedor principal redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bgKapileio)" />

  <!-- Sombra base -->
  <ellipse cx="256" cy="436" rx="125" ry="12" fill="#000000" opacity="0.4" />

  <!-- VAPOR GEOMÉTRICO (3 líneas estilizadas) -->
  <!-- Vapor izquierdo -->
  <path d="M186 215 C186 185, 206 185, 206 155 C206 135, 194 125, 194 125" fill="none" stroke="url(#creamGrad)" stroke-width="18" stroke-linecap="round" opacity="0.85" />
  <!-- Vapor central (más alto) -->
  <path d="M256 210 C256 175, 276 175, 276 140 C276 115, 256 100, 256 100" fill="none" stroke="url(#amberGrad)" stroke-width="20" stroke-linecap="round" />
  <!-- Vapor derecho -->
  <path d="M326 215 C326 185, 306 185, 306 155 C306 135, 318 125, 318 125" fill="none" stroke="url(#creamGrad)" stroke-width="18" stroke-linecap="round" opacity="0.85" />

  <!-- TAZÓN (Cuerpo principal) -->
  <path d="M116 266 H396 C396 356, 336 402, 256 402 C176 402, 116 356, 116 266 Z" fill="url(#amberGrad)" />
  
  <!-- Luz volumétrica en la mitad derecha del tazón (mismo estilo que Axioma Ágora) -->
  <path d="M256 266 H396 C396 356, 336 402, 256 402 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Borde superior del tazón -->
  <rect x="96" y="246" width="320" height="28" rx="14" fill="url(#creamGrad)" />

  <!-- Base / Plato inferior -->
  <rect x="186" y="400" width="140" height="22" rx="11" fill="url(#creamGrad)" />
</svg>